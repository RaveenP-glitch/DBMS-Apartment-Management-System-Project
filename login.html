<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--=============== REMIXICONS ===============-->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/css/login.css" />

    <title>Responsive login form</title>
  </head>
  <body>
    <div class="login">
        <div class="login__content">
            <img class="login__img" src="images\logo_1_criwwp.png" alt="Login image" />

            <form class="login__form">
                <div>
                    <h1 class="login__title">
                        <span>Welcome</span> Back
                    </h1>

                    <p class="login__description">
                        Welcome! Please select user type to continue.
                    </p>
                </div>

                <div>
                    <div class="login__inputs">
                        <div>
                            <label for="userType" class="login__label">Select User Type</label>
                            <select id="userType" class="login__input">
                                <option value="">Select User Type</option>
                                <option value="admin">Admin</option>
                                <option value="employee">Employee</option>
                                <option value="tenant">Tenant</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="login__buttons">
                        <button type="submit" class="login__button">Continue</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>


<script>
    document.querySelector(".login__form").addEventListener("submit", function(event) {
        event.preventDefault();
        
        var userType = document.getElementById("userType").value;
        if (userType) {
            switch (userType) {
                case "admin":
                    window.location.href = "admin/admin_login.php";
                    break;
                case "employee":
                    window.location.href = "employee/employeelogin.php";
                    break;
                case "tenant":
                    window.location.href = "tenant/tenant_login.php";
                    break;
                default:
                    alert("Invalid user type");
            }
        } else {
            alert("Please select a user type");
        }
    });
</script>
</body>
</html>
